# ============================================
# 构建性能优化
# ============================================

# JVM 参数 — 增大堆内存以加速编译
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 启用并行构建
org.gradle.parallel=true

# 启用构建缓存（复用任务输出，大幅减少增量编译时间）
org.gradle.caching=true

# 启用配置缓存（Gradle 9.x 原生支持，跳过配置阶段以加速启动）
org.gradle.configuration-cache=true

# 启用文件系统监控（VFS），减少 up-to-date 检查开销
org.gradle.vfs.watch=true

# Gradle Daemon 保活时间（毫秒），避免频繁重启 daemon
org.gradle.daemon.idletimeout=72000000

# ============================================
# Kotlin 编译优化
# ============================================
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC

# 并行编译 Kotlin 任务
kotlin.parallel.tasks.in.project=true

# ============================================
# Android 构建优化
# ============================================
# 使用非传递 R 类（减少 R 文件体积，加快编译）
android.nonTransitiveRClass=true

# 禁用 test fixtures（如果不用的话）
android.experimental.testFixtures=false

# ============================================
# 其他
# ============================================
# 禁用自动 JDK 下载（使用本地 JAVA_HOME）
org.gradle.java.installations.auto-download=false

# 不使用 buildSrc 的 workspace 模型（加快配置）
org.gradle.unsafe.configuration-cache.max-problems=50
